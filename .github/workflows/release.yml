name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

      - name: Decode Keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.jks

      - name: Set Signing Credentials
        run: |
          echo "RELEASE_STORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
          echo "RELEASE_KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> $GITHUB_ENV
          echo "RELEASE_KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> $GITHUB_ENV

      - run: chmod +x gradlew

      - run: ./gradlew assembleRelease

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk "RainyEmbedding-${{ github.ref_name }}.apk"

      - name: Create Release & Upload
        uses: softprops/action-gh-release@v2
        with:
          name: "🔢 RainyEmbedding ${{ github.ref_name }}"
          body: |
            ## 🔢 RainyEmbedding ${{ github.ref_name }}

            纯离线 Android 本地文本向量化服务器。

            ### 📦 安装
            1. 下载 APK 安装
            2. 打开 App，在「模型管理」中下载模型
            3. 启动服务，API 地址 `http://127.0.0.1:8081`

            ### ⚠️ 注意
            - 模型需在 HuggingFace 上 Accept Gemma License 后下载
            - 仅支持 arm64-v8a 架构
            - 需要 Android 12+ (API 31+)
          files: RainyEmbedding-${{ github.ref_name }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
